[project]
name = "methodist-chat"
version = "0.1.0"
description = "ИИ-ассистент методиста: актуализация УММ, поиск литературы, RAG по нормативке."
authors = [{name = "Methodist Chat"}]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.6",
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "ddgs>=6.0",
    "crossrefapi>=1.5",
    "pyalex>=0.13",
    "arxiv>=2.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "streamlit>=1.41,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
